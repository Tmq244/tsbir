experiment:
  name: taskformer_coco_clip_10ep_gpu12_bs96
  seed: 2026
  output_dir: outputs/taskformer_coco_clip_10ep_gpu12_bs96

data:
  root: data
  train_manifest: data/processed/manifests/train.jsonl
  val_manifest: data/processed/manifests/val.jsonl
  test_manifest: data/processed/manifests/test.jsonl
  caption_sampling: all
  train_pairs_per_epoch: 566747
  image_size: 224
  workers_per_gpu: 6

model:
  architecture: ViT-B-16
  embed_dim: 512
  weight_sharing: true
  feature_fusion: avg
  normalize_fused_query: true
  num_classes: 90
  decoder_depth: 6
  decoder_heads: 8
  decoder_max_length: 77
  init: clip_pretrained           # 从原版 OpenAI CLIP ViT-B/16 backbone 初始化（非 TSBIR checkpoint，也非随机）
  checkpoint: model/ViT-B-16.pt   # OpenAI 官方 CLIP 权重（TorchScript），backbone 部分加载，decoder/分类头随机
  load_optimizer: false

loss:
  contrastive_weight: 100.0
  classification_weight: 10.0
  decoder_weight: 1.0
  asl_gamma_negative: 4.0
  asl_gamma_positive: 1.0
  asl_clip: 0.05
  gather_contrastive_features: true

train:
  epochs: 10                      # 按要求
  batch_size_per_gpu: 96
  expected_world_size: 2
  global_batch_size: 192
  effective_batch_size: 192
  eval_batch_size_per_gpu: 128
  gradient_accumulation_steps: 1
  precision: bf16
  gradient_checkpointing: false      # 关闭：实测 batch96 峰值 ~25GiB（开为 ~9GiB），46GiB 显存充足
  gradient_clip_norm: 1.0
  optimizer: adamw
  learning_rate: 1.0e-5           # 按要求（CLIP 预训练 backbone 微调）
  min_learning_rate: 1.0e-6       # 约为峰值 10%，与原微调 1e-6/1e-7 同比例
  warmup_steps: 1000              # lr 放大 10 倍且有随机头，warmup 略加长（原微调为 100）
  weight_decay: 0.1
  beta1: 0.9
  beta2: 0.98
  eps: 1.0e-6
  scheduler: cosine
  save_last: true
  save_epoch_weights: true
  selection_metric: last_epoch

distributed:
  enabled: true
  backend: nccl
  devices: [1, 2]                 # 仅记录；实际由 CUDA_VISIBLE_DEVICES 决定
  nproc_per_node: 2
  find_unused_parameters: false
  broadcast_buffers: false
